[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "relearn-eval"
version = "1.1.0"
description = "Relearn live eval images: score a submitted artifact on the holdout the control plane delivers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

# A scorer needs a model runtime. Each is an extra so the contract layer can be
# tested, linted, and built without pulling CUDA wheels; a published image is
# built with the extra its challenge needs (`--build-arg WITH_RUNTIME=1`).
#
# `runtime` serves the two language challenges, `relearn` and `relearn-agent`.
# `runtime-image` serves `relearn-image`, which generates rather than
# generating text and so needs diffusers instead of peft.
[project.optional-dependencies]
runtime = [
  "torch>=2.4",
  "transformers>=4.44",
  "accelerate>=0.33",
  "peft>=0.12",
  "safetensors>=0.4",
  "pillow>=10.3",
  "numpy>=1.26",
]
runtime-image = [
  "torch>=2.4",
  "diffusers>=0.31",
  "transformers>=4.44",
  "accelerate>=0.33",
  "peft>=0.12",
  "safetensors>=0.4",
  "sentencepiece>=0.2",
  "pillow>=10.3",
  "numpy>=1.26",
]
vllm = ["vllm>=0.6"]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10.3", "numpy>=1.26"]

# One console script per challenge. They are separate entrypoints on purpose:
# a pod runs exactly one challenge, and a harvest client that named the wrong
# binary must fail rather than score the wrong thing.
[project.scripts]
relearn-eval = "relearn_eval.cli:main"
relearn-image-eval = "relearn_image_eval.cli:main"
relearn-agent-eval = "relearn_agent_eval.cli:main"

[tool.setuptools]
package-dir = { "" = "eval/src" }

[tool.setuptools.packages.find]
where = ["eval/src"]

[tool.setuptools.package-data]
relearn_eval = ["catalog/*.jsonl"]
relearn_agent_eval = ["catalog/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["eval/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
